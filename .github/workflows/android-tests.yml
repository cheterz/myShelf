name: Android Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # защита от зависшего эмулятора

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # ← ВКЛЮЧАЕМ KVM (аппаратное ускорение)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ← ЭМУЛЯТОР + ТЕСТЫ
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34 # твой targetSdk
          arch: x86_64 # для Ubuntu
          profile: pixel_3a
          target: google_apis # без Play Store — легче
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      # ← ОТЧЁТ (даже если тесты упали)
      - name: Pull Allure results
        if: always()
        run: adb pull /storage/emulated/0/Documents/allure-results ./allure-results || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/androidTests/connected/

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
